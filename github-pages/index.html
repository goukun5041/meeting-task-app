<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
    <meta http-equiv="refresh" content="0; url=https://meeting-task-app.netlify.app/">
    <link rel="canonical" href="https://meeting-task-app.netlify.app/">
    <title>課題管理アプリへ移動します</title>
    <style>
      body {
        margin: 2rem;
        color: #1f2937;
        font-family: system-ui, sans-serif;
      }
    </style>
    <script>
      const target = new URL('https://meeting-task-app.netlify.app/')
      target.search = window.location.search
      target.hash = window.location.hash
      window.location.replace(target.href)
    </script>
  </head>
  <body>
    <p>
      課題管理アプリはNetlifyへ移転しました。
      自動的に移動しない場合は
      <a href="https://meeting-task-app.netlify.app/">こちらを開いてください</a>。
    </p>
  </body>
</html>
