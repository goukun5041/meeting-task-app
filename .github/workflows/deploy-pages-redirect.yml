name: Redirect GitHub Pages to Netlify

on:
  push:
    branches: [main]
    paths:
      - github-pages/**
      - .github/workflows/deploy-pages-redirect.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload redirect page
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy redirect page
        id: deployment
        uses: actions/deploy-pages@v4
